<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Headings</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .box {
      width: 90%;
      max-width: 620px;
      padding: 10px 15px;
      background: #fff;
      border: none;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.35);
    }

    /* Heading 1: top outline only, as wide as the text, pink shadow */
    h1 {
      display: inline-block;
      border-top: 5px solid black;
      filter: drop-shadow(2px 2px 0 pink);
      margin: 10px 0;
    }

    /* Heading 2: italic, full-width box with thin black inner line and yellow outer line */
    h2 {
      font-style: italic;
      border: 5px ridge yellow;
      box-shadow: inset 0 0 0 1px black;
      margin: 20px 3px;
    }

    /* Heading 3: right-aligned and underlined */
    h3 {
      text-align: right;
      text-decoration: underline;
      text-decoration-thickness: 3px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <h3>This is heading 3</h3>
  </div>
</body>
</html>
